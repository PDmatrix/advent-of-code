[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advent-repo"
version = "0.1.0"
description = "Python tooling for this Advent of Code repository"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
advent = "advent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/advent"]

[tool.pytest.ini_options]
testpaths = ["tests", "solutions"]
addopts = "--import-mode=importlib"

[tool.advent]
# Events through 2024 have 25 days. Later events use this configurable default.
default-days = 12

# Add year-specific overrides here if an event's length changes.
[tool.advent.days-per-year]
2025 = 12
